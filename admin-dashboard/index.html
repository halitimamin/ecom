<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — House &amp; Co.</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">
<header class="site-header">
  <div class="container header-row">
    <a class="logo" href="../index.html">House &amp; Co.</a>
    <nav class="nav">
      <ul>
        <li><a href="../index.html">Shop</a></li>
        <li><a href="../products.html">Products</a></li>
        <li><a href="../cart.html">Cart</a></li>
        <li><a href="index.html">Admin</a></li>
      </ul>
    </nav>
  </div>
</header>
<main class="container">
  <h1 class="page-title">Admin Dashboard</h1>
  <section class="stats">
    <div class="stat"><span class="stat-value" id="stat-total">0</span><span class="stat-label">Orders</span></div>
    <div class="stat"><span class="stat-value" id="stat-pending">0</span><span class="stat-label">Pending</span></div>
    <div class="stat"><span class="stat-value" id="stat-confirmed">0</span><span class="stat-label">Confirmed</span></div>
  </section>
  <section>
    <div class="section-head">
      <h2>Orders</h2>
      <button class="btn-refresh" id="refresh-btn" type="button">Refresh</button>
    </div>
    <div class="orders-list" id="orders-list"></div>
  </section>
</main>
<script src="../js/supabase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
