<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — House &amp; Co.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Admin Dashboard</h1>
  <a class="back-link" href="../index.html">&larr; Back to shop</a>
</header>
<main class="container">
  <section class="stats">
    <div class="stat"><span class="stat-value" id="stat-total">0</span><span class="stat-label">Orders</span></div>
    <div class="stat"><span class="stat-value" id="stat-pending">0</span><span class="stat-label">Pending</span></div>
    <div class="stat"><span class="stat-value" id="stat-confirmed">0</span><span class="stat-label">Confirmed</span></div>
  </section>
  <section>
    <div class="section-head">
      <h2>Orders</h2>
      <button class="btn-refresh" id="refresh-btn" type="button">Refresh</button>
    </div>
    <div class="orders-list" id="orders-list"></div>
    <p class="empty-note" id="empty-note">No orders yet. Customers' orders appear here after they check out on the shop.</p>
  </section>
</main>
<script src="admin.js"></script>
</body>
</html>
